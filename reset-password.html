<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Cartiva</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   <link
    rel="icon"
    type="image/png"
    href="images/cartiva-icon.png"
>
</head>

<body>

    <div class="page-loader"></div>

    <div class="background">
        <div class="gradient-orb orb-one"></div>
        <div class="gradient-orb orb-two"></div>
        <div class="gradient-orb orb-three"></div>

        <div class="grid"></div>

        <span class="floating-circle circle-one"></span>
        <span class="floating-circle circle-two"></span>
        <span class="floating-circle circle-three"></span>
        <span class="floating-circle circle-four"></span>
    </div>


    <main class="auth-container">

        <section class="brand-section">

            <div class="brand-content">

                <div class="brand-name">
                    <img src="images/cartiva-logo.png" alt="Cartiva">
                </div>

                <div class="hero-copy">
                    <p class="eyebrow">ACCOUNT RECOVERY</p>

                    <h1>
                        Choose a new<br>
                        <span>password.</span>
                    </h1>

                    <p class="hero-description">
                        Pick something you haven't used before on Cartiva.
                    </p>
                </div>

            </div>

        </section>


        <section class="login-section">

            <div class="login-card">

                <div class="card-top">

                    <div class="mobile-logo">
                        <div class="brand-mark">C</div>
                        <span>CARTIVA</span>
                    </div>

                    <div class="welcome-icon">
                        <span>✦</span>
                    </div>

                    <p class="card-eyebrow">RESET PASSWORD</p>

                    <h2>Set a new password</h2>

                    <p class="subtitle">
                        Reset links expire after 30 minutes.
                    </p>

                </div>


                <form id="resetForm">

                    <div class="input-group">

                        <label for="password">New Password</label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <svg viewBox="0 0 24 24">
                                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter a new password"
                                autocomplete="new-password"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">Confirm Password</label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <svg viewBox="0 0 24 24">
                                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </span>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your new password"
                                autocomplete="new-password"
                                required
                            >

                        </div>

                    </div>


                    <button type="submit" class="sign-in-btn">

                        <span class="button-text">Reset Password</span>

                        <span class="button-arrow">
                            →
                        </span>

                        <span class="button-loader"></span>

                    </button>


                    <div id="message" class="message"></div>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <div class="register-prompt">

                    <span>Remembered it after all?</span>

                    <a href="login.html">
                        Back to sign in
                        <span>→</span>
                    </a>

                </div>


                <div class="security-note">

                    <span>🔒</span>
                    <span>Your connection is secure and encrypted.</span>

                </div>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>
    <script>

        const resetForm = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const submitButton = document.querySelector(".sign-in-btn");

        const token =
            new URLSearchParams(window.location.search).get("token");

        if (!token) {

            showMessage(
                "This reset link is missing or invalid. Please request a new one.",
                "error"
            );

            resetForm.querySelectorAll("input, button").forEach(el => {
                el.disabled = true;
            });

        }

        resetForm.addEventListener("submit", async (e) => {

            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters.", "error");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            submitButton.classList.add("loading");
            submitButton.disabled = true;

            try {

                const response = await fetch("/api/reset-password", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({ token, password })

                });

                const data = await response.json();

                if (response.ok) {

                    showMessage(
                        "Password reset. Redirecting to sign in...",
                        "success"
                    );

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1200);

                } else {

                    showMessage(
                        data.message || "This reset link is invalid or has expired.",
                        "error"
                    );

                    submitButton.classList.remove("loading");
                    submitButton.disabled = false;

                }

            } catch (error) {

                showMessage(
                    "Unable to connect to the server. Please try again.",
                    "error"
                );

                submitButton.classList.remove("loading");
                submitButton.disabled = false;

            }

        });

        function showMessage(text, type) {

            message.textContent = text;
            message.className = "message " + type;

        }

    </script>

</body>
</html>
