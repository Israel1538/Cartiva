<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | Cartiva</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "DM Sans", sans-serif;
    background: #f8f8f6;
    color: #111;
}

a {
    text-decoration: none;
    color: inherit;
}

.navbar {
    height: 82px;
    background: white;
    border-bottom: 1px solid #e7e7e3;
    display: flex;
    align-items: center;
}

.nav-inner {
    width: min(1400px, 92%);
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-family: "Manrope", sans-serif;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -1.5px;
}

.logo span {
    color: #ff5a1f;
}

.nav-links {
    display: flex;
    gap: 30px;
}

.nav-links a {
    font-size: 14px;
    font-weight: 600;
    color: #666;
}

.nav-links a:hover {
    color: #ff5a1f;
}

.nav-actions {
    display: flex;
    gap: 8px;
}

.nav-action {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cart-wrapper {
    position: relative;
}

.cart-count {
    position: absolute;
    top: 0;
    right: 0;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 20px;
    background: #ff5a1f;
    color: white;
    font-size: 9px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
}

.page {
    width: min(1200px, 92%);
    margin: 55px auto 90px;
}

.page-title {
    margin-bottom: 30px;
}

.page-title span {
    color: #ff5a1f;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
}

.page-title h1 {
    font-family: "Manrope", sans-serif;
    font-size: 48px;
    letter-spacing: -2px;
    margin-top: 8px;
}

.cart-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 25px;
}

.cart-items,
.summary {
    background: white;
    border: 1px solid #e7e7e3;
    border-radius: 20px;
    padding: 25px;
}

.cart-item {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 18px;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid #eee;
}

.cart-item:first-child {
    padding-top: 0;
}

.product-image {
    width: 90px;
    height: 90px;
    border-radius: 12px;
    object-fit: cover;
    background: #f4f4f1;
}

.product-name {
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 15px;
}

.product-price {
    margin-top: 6px;
    color: #ff5a1f;
    font-weight: 700;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
}

.quantity button {
    width: 30px;
    height: 30px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 7px;
    cursor: pointer;
}

.quantity span {
    font-size: 13px;
    font-weight: 700;
}

.remove {
    border: none;
    background: transparent;
    color: #d64545;
    cursor: pointer;
    font-size: 12px;
}

.summary h2 {
    font-family: "Manrope", sans-serif;
    font-size: 20px;
    margin-bottom: 20px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 13px;
}

.total {
    border-top: 1px solid #eee;
    padding-top: 18px;
    margin-top: 18px;
    font-size: 18px;
    font-weight: 800;
}

.checkout {
    width: 100%;
    margin-top: 20px;
    border: none;
    background: #ff5a1f;
    color: white;
    padding: 15px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
}

.checkout:hover {
    background: #e84d17;
}

.empty {
    text-align: center;
    padding: 70px 20px;
}

.empty i {
    font-size: 40px;
    color: #ccc;
    margin-bottom: 18px;
}

.empty h2 {
    font-family: "Manrope", sans-serif;
}

.empty p {
    color: #777;
    font-size: 13px;
    margin-top: 8px;
}

.shop-btn {
    display: inline-block;
    margin-top: 20px;
    background: #ff5a1f;
    color: white;
    padding: 12px 20px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 700;
}

@media(max-width: 850px) {

    .nav-links {
        display: none;
    }

    .cart-layout {
        grid-template-columns: 1fr;
    }

}

@media(max-width: 550px) {

    .page-title h1 {
        font-size: 38px;
    }

    .cart-item {
        grid-template-columns: 70px 1fr;
    }

    .product-image {
        width: 70px;
        height: 70px;
    }

    .remove {
        grid-column: 2;
    }

}

</style>

</head>


<body>


<header class="navbar">

<div class="nav-inner">

<a href="index.html" class="logo">
Cartiva<span>.</span>
</a>

<nav class="nav-links">

<a href="index.html">Home</a>

<a href="shop.html">Shop</a>

<a href="categories.html">Categories</a>

<a href="deals.html">Deals</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

</nav>

<div class="nav-actions">

<a href="account.html" class="nav-action">
<i class="fa-regular fa-user"></i>
</a>

<a href="cart.html" class="nav-action cart-wrapper">

<i class="fa-solid fa-bag-shopping"></i>

<span class="cart-count" id="cartCount">
0
</span>

</a>

</div>

</div>

</header>


<main class="page">


<div class="page-title">

<span>YOUR CART</span>

<h1>Shopping Cart</h1>

</div>


<div id="cartContainer"></div>


</main>


<script src="js/auth.js"></script>
<script>


let cart = [];

const cartContainer =
    document.getElementById("cartContainer");


function loadCart() {

    try {

        cart =
            JSON.parse(
                localStorage.getItem("cartivaCart")
            ) || [];

        if(!Array.isArray(cart)){

            cart = [];

        }

        renderCart();

    } catch (error) {

        console.error(
            "Could not load cart:",
            error
        );

        cart = [];

        renderCart();

    }

}


function saveCart() {

    localStorage.setItem(
        "cartivaCart",
        JSON.stringify(cart)
    );

}


function updateCartCount() {

    let count = 0;

    cart.forEach(item => {

        count += Number(item.quantity) || 1;

    });

    document.getElementById(
        "cartCount"
    ).textContent = count;

}


function renderCart() {


    updateCartCount();


    if(cart.length === 0) {

        cartContainer.innerHTML = `

            <div class="cart-items empty">

                <i class="fa-solid fa-bag-shopping"></i>

                <h2>Your cart is empty</h2>

                <p>
                    Looks like you haven't added
                    anything to your cart yet.
                </p>

                <a
                    href="shop.html"
                    class="shop-btn"
                >
                    Start Shopping
                </a>

            </div>

        `;

        return;

    }


    let subtotal = 0;


    let itemsHTML = "";


    cart.forEach((item, index) => {


        const quantity =
            Number(item.quantity) || 1;


        const price =
            Number(item.price) || 0;


        subtotal +=
            price * quantity;


        itemsHTML += `

            <div class="cart-item">

                <img
                    class="product-image"
                    src="${item.image || "https://via.placeholder.com/300"}"
                    alt="${item.name || "Product"}"
                >

                <div>

                    <div class="product-name">
                        ${item.name || "Product"}
                    </div>

                    <div class="product-price">
                        ₦${price.toLocaleString()}
                    </div>

                    <div class="quantity">

                        <button
                            onclick="changeQuantity(${index}, -1)"
                        >
                            −
                        </button>

                        <span>
                            ${quantity}
                        </span>

                        <button
                            onclick="changeQuantity(${index}, 1)"
                        >
                            +
                        </button>

                    </div>

                </div>


                <button
                    class="remove"
                    onclick="removeItem(${index})"
                >
                    Remove
                </button>

            </div>

        `;

    });


    const shipping =
        subtotal >= 100000
        ? 0
        : 2500;


    const total =
        subtotal + shipping;


    cartContainer.innerHTML = `

        <div class="cart-layout">


            <div class="cart-items">

                ${itemsHTML}

            </div>


            <div class="summary">

                <h2>
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        ₦${subtotal.toLocaleString()}
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Shipping
                    </span>

                    <strong>
                        ${
                            shipping === 0
                            ? "FREE"
                            : "₦" + shipping.toLocaleString()
                        }
                    </strong>

                </div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <strong>
                        ₦${total.toLocaleString()}
                    </strong>

                </div>


                <button
                    class="checkout"
                    onclick="goToCheckout()"
                >
                    Proceed to Checkout
                </button>

            </div>


        </div>

    `;

}


function changeQuantity(index, amount) {

    cart[index].quantity =
        (Number(cart[index].quantity) || 1)
        + amount;


    if(cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart();

    renderCart();

}


function removeItem(index) {

    cart.splice(index, 1);

    saveCart();

    renderCart();

}


function goToCheckout() {

    if(cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }


    window.location.href =
        "checkout.html";

}


loadCart();

</script>

</body>
</html>
